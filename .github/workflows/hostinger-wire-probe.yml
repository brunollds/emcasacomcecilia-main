name: Probe Hostinger managed wire
run-name: hostinger-wire-${{ inputs.confirm }}-${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escolha captura somente leitura ou deploy gerenciado controlado.'
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - 'CAPTURE_ONLY'

permissions:
  contents: read

concurrency:
  group: emcasa-production
  cancel-in-progress: false

jobs:
  probe:
    if: inputs.confirm == 'CAPTURE_ONLY'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment:
      name: production-observe
      url: https://emcasacomcecilia.com
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      HOSTINGER_ACCOUNT: u150185510
      HOSTINGER_DOMAIN: emcasacomcecilia.com
      HOST: u150185510@46.202.145.2
      PORT: '65002'
      ROOT: /home/u150185510/domains/emcasacomcecilia.com
      SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Compute source identity
        shell: bash
        run: |
          set -euo pipefail
          target_sha=$(git rev-parse HEAD)
          echo "TARGET_SHA=$target_sha" >> "$GITHUB_ENV"

      - name: Configure read-only SSH inspection
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$SSH_KEY" ] || { echo 'HOSTINGER_SSH_KEY is missing' >&2; exit 1; }
          [ -n "$KNOWN_HOSTS" ] || { echo 'HOSTINGER_KNOWN_HOSTS is missing' >&2; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -F "[46.202.145.2]:65002" -f ~/.ssh/known_hosts >/dev/null

      - name: Capture pre-deploy runtime state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          {
            echo "captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "candidate_target_sha=$TARGET_SHA"
            echo
            echo 'PUBLIC_ATTESTATION'
            curl -4 --fail --silent --show-error --dump-header - \
              --connect-timeout 10 --max-time 25 \
              --retry 3 --retry-delay 3 --retry-all-errors \
              -H 'Cache-Control: no-cache' \
              "https://$HOSTINGER_DOMAIN/api/release?cb=pre-$GITHUB_RUN_ID-$(date +%s)"
            echo
            echo 'PUBLIC_HOME_HEADERS'
            curl -4 --fail --silent --show-error --dump-header - \
              --connect-timeout 10 --max-time 25 \
              --retry 3 --retry-delay 3 --retry-all-errors \
              --output artifacts/pre-deploy-home.html \
              -H 'Cache-Control: no-cache' \
              "https://$HOSTINGER_DOMAIN/?cb=pre-$GITHUB_RUN_ID-$(date +%s)"
            echo
            echo 'REMOTE_RUNTIME'
            ssh -i ~/.ssh/id_ed25519 -p "$PORT" -o StrictHostKeyChecking=yes "$HOST" \
              "ROOT='$ROOT' ACCOUNT='$HOSTINGER_ACCOUNT' bash -s" <<'REMOTE' \
              | tee artifacts/pre-deploy-remote.txt
          set -euo pipefail
          echo "remote_captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "root=$ROOT"
          echo
          echo 'WORKERS'
          for pid in $(pgrep -u "$ACCOUNT" -f next-server 2>/dev/null || true); do
            cwd=$(readlink "/proc/$pid/cwd" 2>/dev/null || true)
            case "$cwd" in
              "$ROOT"/*)
                echo "pid=$pid cwd=$cwd"
                if [ -f "$cwd/.next/BUILD_ID" ]; then
                  echo "pid=$pid build_id=$(tr -d '\n' < "$cwd/.next/BUILD_ID")"
                else
                  echo "pid=$pid build_id=absent"
                fi
                if [ -f "$cwd/release-meta.json" ]; then
                  echo "pid=$pid runtime_meta=$(tr -d '\n' < "$cwd/release-meta.json")"
                else
                  echo "pid=$pid runtime_meta=absent"
                fi
                ;;
            esac
          done
          echo
          echo 'RELEASE_META_FILES'
          # Pipelines intencionais: este host não oferece /dev/fd para `< <(...)`.
          # Os `while` abaixo só imprimem; não acumule estado para usar após o subshell.
          find "$ROOT/nodejs" "$ROOT/hbuilds" -maxdepth 8 \
            -name release-meta.json -type f -print 2>/dev/null | sort |
          while IFS= read -r meta; do
            echo "path=$meta"
            echo "body=$(tr -d '\n' < "$meta")"
          done
          echo
          echo 'BUILD_IDS'
          find "$ROOT/nodejs/.next" "$ROOT/hbuilds/versions" -maxdepth 6 \
            -name BUILD_ID -type f -print 2>/dev/null | sort |
          while IFS= read -r build_id; do
            echo "path=$build_id value=$(tr -d '\n' < "$build_id")"
          done
          echo
          echo 'SOURCE_ARCHIVES'
          find "$ROOT" -maxdepth 5 -type f \
            \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.tgz' \) \
            -printf 'path=%p bytes=%s modified=%TY-%Tm-%TdT%TH:%TM:%TSZ\n' 2>/dev/null | sort
          REMOTE
            echo
            echo 'PUBLIC_WORKER_BUILD_MANIFESTS'
            grep -oE 'build_id=[^[:space:]]+' artifacts/pre-deploy-remote.txt \
              | cut -d= -f2 | sort -u > artifacts/pre-deploy-worker-build-ids.txt
            test -s artifacts/pre-deploy-worker-build-ids.txt
            while IFS= read -r build_id; do
              case "$build_id" in
                ''|*[!a-zA-Z0-9_-]*) echo "BUILD_ID remoto inválido: $build_id" >&2; exit 1 ;;
              esac
              echo "build_id=$build_id"
              curl -4 --fail --silent --show-error --dump-header - \
                --connect-timeout 10 --max-time 25 \
                --retry 3 --retry-delay 3 --retry-all-errors \
                --output "artifacts/public-build-$build_id.js" \
                -H 'Cache-Control: no-cache' \
                "https://$HOSTINGER_DOMAIN/_next/static/$build_id/_buildManifest.js?cb=pre-$GITHUB_RUN_ID"
            done < artifacts/pre-deploy-worker-build-ids.txt
          } > artifacts/pre-deploy-runtime.txt
          node scripts/deploy/capture-hostinger-build-inventory.mjs

      - name: Scan pre-deploy runtime state for secrets
        if: always()
        id: artifact_scan
        env:
          SCAN_SECRET_HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          SCAN_SECRET_HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: node scripts/deploy/scan-artifacts.mjs artifacts

      - name: Preserve pre-deploy runtime state
        if: always() && steps.artifact_scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-runtime-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Record observation result
        if: always()
        shell: bash
        run: |
          {
            echo '## Hostinger managed wire probe'
            printf '%s\n' "- mode: \`${{ inputs.confirm }}\`"
            printf '%s\n' "- target_sha: \`$TARGET_SHA\`"
            if [ "${{ job.status }}" = 'success' ]; then
              echo '- result: read-only capture preserved; build, archive and dispatch skipped'
            else
              echo '- result: incomplete read-only capture; no build, archive or dispatch executed'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
