name: Probe Hostinger managed wire
run-name: hostinger-wire-probe-${{ github.run_id }}

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Confirma um deploy gerenciado controlado em produção?'
        required: true
        default: 'NO'
        type: choice
        options:
          - 'NO'
          - 'PROBE_PRODUCTION'

permissions:
  contents: read

concurrency:
  group: emcasa-production
  cancel-in-progress: false

jobs:
  probe:
    if: inputs.confirm == 'PROBE_PRODUCTION'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://emcasacomcecilia.com
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      HOSTINGER_ACCOUNT: u150185510
      HOSTINGER_DOMAIN: emcasacomcecilia.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute release identity
        shell: bash
        run: |
          set -euo pipefail
          target_sha=$(git rev-parse HEAD)
          deploy_uuid=$(node -e 'console.log(require("node:crypto").randomUUID())')
          {
            echo "TARGET_SHA=$target_sha"
            echo "DEPLOY_UUID=$deploy_uuid"
            echo "ARCHIVE_NAME=emcasa-wire-$target_sha-$deploy_uuid.tar.gz"
          } >> "$GITHUB_ENV"

      - name: Build and prove local attestation
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("node:fs");fs.writeFileSync("release-meta.json",JSON.stringify({target_sha:process.env.TARGET_SHA,deploy_uuid:process.env.DEPLOY_UUID})+"\n")'
          RELEASE_META_REQUIRED=1 npm run build
          npm run verify:release
          npm run test:hostinger-wire

      - name: Assemble committed source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .wire-meta/emcasacomcecilia
          cp release-meta.json .wire-meta/emcasacomcecilia/release-meta.json
          git archive --format=tar --prefix=emcasacomcecilia/ --output=emcasa-wire.tar HEAD
          tar -rf emcasa-wire.tar -C .wire-meta emcasacomcecilia/release-meta.json
          gzip -9 emcasa-wire.tar
          mv emcasa-wire.tar.gz "$ARCHIVE_NAME"

          count=$(tar -tzf "$ARCHIVE_NAME" | grep -cx 'emcasacomcecilia/release-meta.json')
          [ "$count" = '1' ] || { echo "release-meta count inválido: $count" >&2; exit 1; }
          if tar -tzf "$ARCHIVE_NAME" | grep -Eq '(^|/)(node_modules|\.next|\.git)(/|$)'; then
            echo 'archive contém diretório proibido' >&2
            exit 1
          fi
          bytes=$(stat -c '%s' "$ARCHIVE_NAME")
          echo "archive bytes: $bytes"
          [ "$bytes" -lt 50000000 ] || { echo 'archive excede 50 MB' >&2; exit 1; }

      - name: Execute exact managed wire
        shell: bash
        run: ARCHIVE_PATH="$GITHUB_WORKSPACE/$ARCHIVE_NAME" npm run probe:hostinger-wire

      - name: Record attested identity
        if: always()
        shell: bash
        run: |
          {
            echo '## Hostinger managed wire probe'
            printf '%s\n' "- target_sha: \`$TARGET_SHA\`"
            printf '%s\n' "- deploy_uuid: \`$DEPLOY_UUID\`"
            echo '- Consulte o log do step de wire para `build_uuid`/`dispatch-unknown`.'
            if [ "${{ job.status }}" = 'success' ]; then
              echo '- result: completed + exact public attestation'
            else
              echo '- result: incomplete; não repetir o dispatch sem reconciliar pelo archive name'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
